<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
.card{padding:24px;}
.lbl{font-family:var(--font-pixel);font-size:10px;letter-spacing:.2em;color:var(--foreground-dim);margin-bottom:4px;}
.mono{font-family:var(--font-mono);}
.pix{font-family:var(--font-pixel);}
.lcd{font-family:var(--font-lcd);}
</style></head><body><div class="card">
  <div class="lbl">KBD · BADGES · LCD READOUT</div>
  <div style="display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap">
    <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd>
    <kbd style="min-width:64px">SPACE</kbd>
    <kbd style="min-width:58px">SHIFT</kbd>
    <span style="color:var(--primary);font-family:var(--font-pixel)">+</span>
    <kbd>P</kbd>
  </div>
  <div style="display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap">
    <span class="pix" style="background:rgba(239,51,64,.12);border:1px solid var(--primary);color:var(--primary-light);padding:4px 10px;font-size:10px;letter-spacing:.2em">BANE 3 · SKATTEETATEN</span>
    <span class="pix" style="background:rgba(129,182,76,.12);border:1px solid var(--ok);color:var(--ok);padding:4px 10px;font-size:10px;letter-spacing:.2em">COMBO x3</span>
    <span class="pix" style="background:var(--foreground);color:#050a1a;padding:4px 10px;font-size:10px;letter-spacing:.2em">NEW</span>
  </div>
  <div style="margin-top:14px;display:inline-flex;flex-direction:column;background:#02050f;border:1px solid var(--surface-line);padding:6px 10px;box-shadow:inset 0 0 12px rgba(0,0,0,.6)">
    <span class="pix" style="font-size:9px;letter-spacing:.14em;color:var(--foreground-dim)">HIGH SCORE</span>
    <span class="lcd" style="font-size:28px;line-height:1;color:var(--primary-light);text-shadow:0 0 8px rgba(255,85,96,.6)">338 500</span>
  </div>
</div></body></html>
