<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
.card{padding:24px;}
.lbl{font-family:var(--font-pixel);font-size:10px;letter-spacing:.2em;color:var(--foreground-dim);margin-bottom:4px;}
.mono{font-family:var(--font-mono);}
.pix{font-family:var(--font-pixel);}
.lcd{font-family:var(--font-lcd);}
</style></head><body><div class="card">
  <div class="lbl">RADII · TIGHT ARCADE SCALE</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:12px">
    
      <div style="text-align:center">
        <div style="width:70px;height:70px;background:var(--surface-raised);border:1px solid var(--surface-line);border-radius:2px;margin:0 auto"></div>
        <div class="pix" style="font-size:11px;color:var(--foreground);margin-top:8px">2px</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-dim);margin-top:2px">--radius-sm</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-muted);margin-top:2px">kbd, chips</div>
      </div>
      <div style="text-align:center">
        <div style="width:70px;height:70px;background:var(--surface-raised);border:1px solid var(--surface-line);border-radius:4px;margin:0 auto"></div>
        <div class="pix" style="font-size:11px;color:var(--foreground);margin-top:8px">4px</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-dim);margin-top:2px">--radius-md</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-muted);margin-top:2px">default — cards, inputs</div>
      </div>
      <div style="text-align:center">
        <div style="width:70px;height:70px;background:var(--surface-raised);border:1px solid var(--surface-line);border-radius:6px;margin:0 auto"></div>
        <div class="pix" style="font-size:11px;color:var(--foreground);margin-top:8px">6px</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-dim);margin-top:2px">--radius-lg</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-muted);margin-top:2px">modals</div>
      </div>
      <div style="text-align:center">
        <div style="width:70px;height:70px;background:var(--surface-raised);border:1px solid var(--surface-line);border-radius:8px;margin:0 auto"></div>
        <div class="pix" style="font-size:11px;color:var(--foreground);margin-top:8px">8px</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-dim);margin-top:2px">--radius-xl</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-muted);margin-top:2px">cta — rarely</div>
      </div>
  </div>
  <div class="mono" style="font-size:11px;color:var(--foreground-dim);margin-top:10px">Tightened from 8/12 → 2/4/6. Arcade = square.</div>
</div></body></html>
