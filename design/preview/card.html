<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
.card{padding:24px;}
.lbl{font-family:var(--font-pixel);font-size:10px;letter-spacing:.2em;color:var(--foreground-dim);margin-bottom:4px;}
.mono{font-family:var(--font-mono);}
.pix{font-family:var(--font-pixel);}
.lcd{font-family:var(--font-lcd);}
</style></head><body><div class="card">
  <div class="lbl">PIXEL BEZEL CARD</div>
  <div style="position:relative;background:var(--surface);border:1px solid var(--surface-line);padding:20px;margin-top:14px;box-shadow:0 4px 0 0 rgba(0,0,0,.6)">
    <svg style="position:absolute;top:-1px;left:-1px" width="12" height="12" viewBox="0 0 12 12" shape-rendering="crispEdges"><g fill="#ef3340"><rect x="0" y="0" width="12" height="3"/><rect x="0" y="0" width="3" height="12"/></g></svg>
    <svg style="position:absolute;top:-1px;right:-1px" width="12" height="12" viewBox="0 0 12 12" shape-rendering="crispEdges"><g fill="#ef3340"><rect x="0" y="0" width="12" height="3"/><rect x="9" y="0" width="3" height="12"/></g></svg>
    <svg style="position:absolute;bottom:-1px;left:-1px" width="12" height="12" viewBox="0 0 12 12" shape-rendering="crispEdges"><g fill="#ef3340"><rect x="0" y="9" width="12" height="3"/><rect x="0" y="0" width="3" height="12"/></g></svg>
    <svg style="position:absolute;bottom:-1px;right:-1px" width="12" height="12" viewBox="0 0 12 12" shape-rendering="crispEdges"><g fill="#ef3340"><rect x="0" y="9" width="12" height="3"/><rect x="9" y="0" width="3" height="12"/></g></svg>
    <div class="pix" style="font-size:18px;color:var(--foreground);letter-spacing:.02em">MISSION BRIEFING</div>
    <div class="mono" style="font-size:13px;color:var(--foreground-muted);margin-top:8px;line-height:1.55">Samle finansieringer i riktig rekkefølge. Unngå byråkratiske feller. Ikke drukn i fjorden.</div>
  </div>
  <div class="mono" style="font-size:11px;color:var(--foreground-dim);margin-top:10px">4 pixel corner brackets · hard 4px drop shadow · 1px border.</div>
</div></body></html>
