<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
.card{padding:24px;}
.lbl{font-family:var(--font-pixel);font-size:10px;letter-spacing:.2em;color:var(--foreground-dim);margin-bottom:4px;}
.mono{font-family:var(--font-mono);}
.pix{font-family:var(--font-pixel);}
.lcd{font-family:var(--font-lcd);}
</style></head><body><div class="card">
  <div class="lbl">FJORD NIGHT · NEUTRALS</div>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px">
    
      <div style="background:#020615;padding:14px 10px;color:#eaf2ff;border:1px solid var(--surface-line)">
        <div class="pix" style="font-size:9px;letter-spacing:.14em;opacity:.6">background-deep</div>
        <div class="mono" style="font-size:12px;margin-top:4px">#020615</div>
        
      </div>
      <div style="background:#050a1a;padding:14px 10px;color:#eaf2ff;border:1px solid var(--surface-line)">
        <div class="pix" style="font-size:9px;letter-spacing:.14em;opacity:.6">background</div>
        <div class="mono" style="font-size:12px;margin-top:4px">#050a1a</div>
        <div class="mono" style="font-size:10px;opacity:.6;margin-top:2px">primary canvas</div>
      </div>
      <div style="background:#0b1530;padding:14px 10px;color:#eaf2ff;border:1px solid var(--surface-line)">
        <div class="pix" style="font-size:9px;letter-spacing:.14em;opacity:.6">surface</div>
        <div class="mono" style="font-size:12px;margin-top:4px">#0b1530</div>
        <div class="mono" style="font-size:10px;opacity:.6;margin-top:2px">cards</div>
      </div>
      <div style="background:#122247;padding:14px 10px;color:#eaf2ff;border:1px solid var(--surface-line)">
        <div class="pix" style="font-size:9px;letter-spacing:.14em;opacity:.6">surface-raised</div>
        <div class="mono" style="font-size:12px;margin-top:4px">#122247</div>
        <div class="mono" style="font-size:10px;opacity:.6;margin-top:2px">hover</div>
      </div>
      <div style="background:#1d3060;padding:14px 10px;color:#eaf2ff;border:1px solid var(--surface-line)">
        <div class="pix" style="font-size:9px;letter-spacing:.14em;opacity:.6">surface-line</div>
        <div class="mono" style="font-size:12px;margin-top:4px">#1d3060</div>
        <div class="mono" style="font-size:10px;opacity:.6;margin-top:2px">border</div>
      </div>
  </div>
  <div style="margin-top:14px;display:flex;gap:8px">
    <div style="flex:1;background:var(--foreground);color:#050a1a;padding:12px"><div class="pix" style="font-size:9px;letter-spacing:.14em">FG · ICE</div><div class="mono" style="font-size:12px;margin-top:2px">#EAF2FF</div></div>
    <div style="flex:1;background:var(--foreground-muted);color:#050a1a;padding:12px"><div class="pix" style="font-size:9px;letter-spacing:.14em">FG MUTED</div><div class="mono" style="font-size:12px;margin-top:2px">#9DB3D6</div></div>
    <div style="flex:1;background:var(--foreground-dim);color:#050a1a;padding:12px"><div class="pix" style="font-size:9px;letter-spacing:.14em">FG DIM</div><div class="mono" style="font-size:12px;margin-top:2px">#5E7AA8</div></div>
  </div>
</div></body></html>
