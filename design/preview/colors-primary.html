<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
.card{padding:24px;}
.lbl{font-family:var(--font-pixel);font-size:10px;letter-spacing:.2em;color:var(--foreground-dim);margin-bottom:4px;}
.mono{font-family:var(--font-mono);}
.pix{font-family:var(--font-pixel);}
.lcd{font-family:var(--font-lcd);}
</style></head><body><div class="card">
  <div style="display:flex;gap:14px;align-items:stretch;">
    <div style="flex:1.6;background:var(--primary);color:var(--primary-ink);padding:18px;border:2px solid var(--primary-ink);box-shadow:0 0 24px rgba(239,51,64,.45);">
      <div class="pix" style="font-size:10px;letter-spacing:.2em;opacity:.85">PRIMARY · SIGNAL RED</div>
      <div class="pix" style="font-size:30px;margin-top:8px">#EF3340</div>
      <div class="mono" style="font-size:11px;opacity:.8;margin-top:4px">--primary</div>
    </div>
    <div style="flex:1;background:var(--primary-light);color:var(--primary-ink);padding:14px;">
      <div class="pix" style="font-size:10px;letter-spacing:.2em;opacity:.85">LIGHT</div>
      <div class="mono" style="font-size:12px;margin-top:6px">#FF5560</div>
    </div>
    <div style="flex:1;background:var(--primary-dark);color:var(--primary-ink);padding:14px;">
      <div class="pix" style="font-size:10px;letter-spacing:.2em;opacity:.85">DARK</div>
      <div class="mono" style="font-size:12px;margin-top:6px">#C41922</div>
    </div>
  </div>
</div></body></html>
