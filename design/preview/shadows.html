<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
.card{padding:24px;}
.lbl{font-family:var(--font-pixel);font-size:10px;letter-spacing:.2em;color:var(--foreground-dim);margin-bottom:4px;}
.mono{font-family:var(--font-mono);}
.pix{font-family:var(--font-pixel);}
.lcd{font-family:var(--font-lcd);}
</style></head><body><div class="card">
  <div class="lbl">SHADOWS &amp; GLOWS</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:12px">
    
      <div style="text-align:center">
        <div style="width:70px;height:70px;background:var(--surface);border:1px solid var(--surface-line);box-shadow:0 1px 0 0 rgba(0,0,0,.5);margin:0 auto"></div>
        <div class="pix" style="font-size:11px;color:var(--foreground);margin-top:14px">sm</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-dim);margin-top:2px">default</div>
      </div>
      <div style="text-align:center">
        <div style="width:70px;height:70px;background:var(--surface);border:1px solid var(--surface-line);box-shadow:0 2px 0 0 rgba(0,0,0,.55);margin:0 auto"></div>
        <div class="pix" style="font-size:11px;color:var(--foreground);margin-top:14px">base</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-dim);margin-top:2px">cards</div>
      </div>
      <div style="text-align:center">
        <div style="width:70px;height:70px;background:var(--surface);border:1px solid var(--surface-line);box-shadow:0 4px 0 0 rgba(0,0,0,.6);margin:0 auto"></div>
        <div class="pix" style="font-size:11px;color:var(--foreground);margin-top:14px">lg</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-dim);margin-top:2px">hero, cta</div>
      </div>
      <div style="text-align:center">
        <div style="width:70px;height:70px;background:var(--surface);border:1px solid var(--surface-line);box-shadow:0 0 24px rgba(239,51,64,.45);margin:0 auto"></div>
        <div class="pix" style="font-size:11px;color:var(--foreground);margin-top:14px">glow-red</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-dim);margin-top:2px">primary cta</div>
      </div>
  </div>
  <div class="mono" style="font-size:11px;color:var(--foreground-dim);margin-top:10px">Hard pixel drops (Y-offset, no blur). Red glow reserved for primary CTAs.</div>
</div></body></html>
