<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
.card{padding:24px;}
.lbl{font-family:var(--font-pixel);font-size:10px;letter-spacing:.2em;color:var(--foreground-dim);margin-bottom:4px;}
.mono{font-family:var(--font-mono);}
.pix{font-family:var(--font-pixel);}
.lcd{font-family:var(--font-lcd);}
</style></head><body><div class="card">
  <div style="display:grid;grid-template-columns:80px 1fr;gap:10px 16px;align-items:baseline">
    
      <div class="mono" style="font-size:10px;letter-spacing:.1em;color:var(--foreground-dim)">H1</div>
      <div>
        <div class="pix" style="font-size:56px;color:var(--foreground);line-height:1.1;">SIGURD STARTUP</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-dim);margin-top:2px">clamp(36,6vw,64)px · Pixelify · 700</div>
      </div>
      <div class="mono" style="font-size:10px;letter-spacing:.1em;color:var(--foreground-dim)">H2</div>
      <div>
        <div class="pix" style="font-size:28px;color:var(--foreground);line-height:1.1;">HVORDAN SPILLE</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-dim);margin-top:2px">30px · Pixelify · 700</div>
      </div>
      <div class="mono" style="font-size:10px;letter-spacing:.1em;color:var(--foreground-dim)">H3</div>
      <div>
        <div class="mono" style="font-size:16px;color:var(--foreground);line-height:1.1;">SECTION HEADER</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-dim);margin-top:2px">18px · JB Mono · 700 · upper · wide</div>
      </div>
      <div class="mono" style="font-size:10px;letter-spacing:.1em;color:var(--foreground-dim)">BODY</div>
      <div>
        <div class="mono" style="font-size:15px;color:var(--foreground);line-height:1.1;">Du er Sigurd. Ung og håpefull.</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-dim);margin-top:2px">16px · JB Mono · 400 · 1.55</div>
      </div>
      <div class="mono" style="font-size:10px;letter-spacing:.1em;color:var(--foreground-dim)">CAPS</div>
      <div>
        <div class="pix" style="font-size:12px;color:var(--foreground);line-height:1.1;">▸ INSERT COIN</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-dim);margin-top:2px">12px · Pixelify · .2em track</div>
      </div>
      <div class="mono" style="font-size:10px;letter-spacing:.1em;color:var(--foreground-dim)">LCD</div>
      <div>
        <div class="lcd" style="font-size:22px;color:var(--primary-light);line-height:1.1;text-shadow:0 0 8px rgba(255,85,96,.5)">338 500 KR</div>
        <div class="mono" style="font-size:10px;color:var(--foreground-dim);margin-top:2px">26px · VT323 · numeric</div>
      </div>
  </div>
</div></body></html>
