<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;padding:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);}
.card{padding:24px;}
.lbl{font-family:var(--font-pixel);font-size:10px;letter-spacing:.2em;color:var(--foreground-dim);margin-bottom:4px;}
.mono{font-family:var(--font-mono);}
.pix{font-family:var(--font-pixel);}
.lcd{font-family:var(--font-lcd);}
</style></head><body><div class="card">
  <div class="lbl">DISPLAY · PIXELIFY SANS</div>
  <div class="pix" style="font-size:56px;line-height:1;color:var(--foreground);text-shadow:3px 3px 0 var(--primary-dark);margin-top:10px">SIGURD</div>
  <div class="pix" style="font-size:56px;line-height:1;color:var(--primary);text-shadow:3px 3px 0 var(--primary-dark)">STARTUP</div>
  <div class="mono" style="font-size:11px;color:var(--foreground-dim);margin-top:12px">Headings H1–H2 · arcade overlays · the wordmark. Never body copy.</div>
</div></body></html>
